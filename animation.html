<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Send Email Button</title>
  <style>
    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
    }

    .send-button {
      background-color: white;
      border: 2px solid #888;
      border-radius: 25px; /* Reduced from 30% larger */
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: border-color 0.3s ease;
    }

    .send-button:hover {
      border-color: #444;
    }

    .icon-wrapper {
      width: 28px;
      height: 28px;
      position: relative;
      flex-shrink: 0;
    }

    .icon {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s ease;
    }

    .email-icon svg {
      stroke: #333;
      fill: none;
      stroke-width: 2;
    }

    .check-icon {
      background-color: black;
      color: white;
      border-radius: 50%;
      opacity: 0;
      transform: scale(0.5);
    }

    .check-icon svg {
      fill: white;
      width: 16px;
      height: 16px;
    }

    .email-icon {
      opacity: 1;
      transform: scale(1);
    }

    .label {
      font-size: 16px;
      color: #333;
      transition: all 0.3s ease;
    }

    .sent .email-icon {
      opacity: 0;
      transform: scale(0.5);
    }

    .sent .check-icon {
      opacity: 1;
      transform: scale(1);
    }

    .sent .label::before {
      content: "Sent";
    }

    .label::before {
      content: "Send Email";
    }
  </style>
</head>
<body>

  <button class="send-button" onclick="sendEmail(this)">
    <div class="icon-wrapper">
      <!-- Email Icon -->
      <div class="icon email-icon">
        <svg viewBox="0 0 24 24">
          <path d="M3 5h18v14H3z"/>
          <polyline points="3,5 12,13 21,5"/>
        </svg>
      </div>
      <!-- Checkmark Icon -->
      <div class="icon check-icon">
        <svg viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
        </svg>
      </div>
    </div>
    <span class="label"></span>
  </button>

  <script>
    function sendEmail(button) {
      button.classList.add('sent');
    }
  </script>

</body>
</html>
