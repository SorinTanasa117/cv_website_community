<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #fff;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .logo-container {
            text-align: center;
            position: relative; /* Add relative positioning */
        }

        .connecting-container {

            width: 100%;
            height: 100%;
            z-index: 1; /* Ensure it's on top */

        }

        /* Keyframes for node animation: fade in, scale up, and move to final position */
        @keyframes node-connect {
          0% {
            opacity: 0;
            transform: translate(var(--initial-x), var(--initial-y)) scale(0.5);
          }
          70% { /* Nodes move and scale up */
            opacity: 1;
            transform: translate(0, 0) scale(1.1);
          }
          100% { /* Settle at final position and scale */
            opacity: 1;
            transform: translate(0, 0) scale(1);
          }
        }

        /* Keyframes for line drawing animation */
        @keyframes line-draw {
          0% {
            stroke-dashoffset: 200; /* Start with line fully hidden */
            opacity: 0;
          }
          100% {
            stroke-dashoffset: 0; /* End with line fully drawn */
            opacity: 1;
          }
        }

        /* Styles for animated nodes */
        .animated-node {
          fill: #6366F1; /* Indigo 500 */
          stroke: #4F46E5; /* Indigo 600 */
          stroke-width: 2;
          opacity: 0; /* Start hidden */
          transform-origin: center center; /* Ensure scaling and translation work correctly */
          animation: node-connect 2s ease-out forwards; /* Play once and stop at end state */
        }

        /* Styles for animated lines */
        .animated-line {
          stroke: #4F46E5; /* Indigo 600 */
          stroke-width: 3;
          stroke-linecap: round;
          stroke-linejoin: round;
          stroke-dasharray: 200; /* Needs to be larger than the longest path length */
          stroke-dashoffset: 200; /* Start with line hidden */
          opacity: 0; /* Start hidden */
          animation: line-draw 1s ease-out forwards; /* Play once and stop at end state */
          animation-fill-mode: forwards;
        }

        .fade-in {
            opacity: 0;
            animation: fadeIn 2s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

    /* --- Mobile Navigation Styles --- */
    @media (max-width: 767px) { /* Corresponds to Tailwind's 'md' breakpoint */
        #main-nav-ul.hidden {
             /* Ensure it remains hidden when .hidden is present, even with !important below */
            display: none !important;
        }
        #main-nav-ul:not(.hidden) {
            /* When .hidden is removed, these styles apply on mobile. */
            display: flex !important; /* Important to override Tailwind's default if it's fighting via other means. */
            flex-direction: column;
            position: absolute;
            top: 100%; /* Position below the nav bar itself */
            left: 0;
            right: 0;
            background-color: #333; /* Same as nav background */
            z-index: 90; /* Below nav's z-index but above other content */
            padding-bottom: 1rem; /* Some spacing at the bottom */
        }

        #main-nav-ul li {
            width: 100%;
            margin: 0;
            text-align: left;
        }

        #main-nav-ul li a {
            padding: 0.75rem 1rem; /* Adjust padding for mobile */
            border-bottom: 1px solid #444;
            display: block; /* Ensure 'a' tags take full width for tapping */
            color: #fff; /* Ensure link color is white like original nav */
        }

        #main-nav-ul li a:hover {
            background-color: #555; /* Consistent hover for mobile */
        }

        #main-nav-ul li:last-child a {
            border-bottom: none;
        }

        /* Mobile styling for dropdowns */
        #main-nav-ul .dropdown {
            display: block; /* Show dropdowns by default in mobile view */
            position: static;
            width: 100%;
            background-color: transparent;
            box-shadow: none;
            padding-left: 1rem; /* Indent sub-menu items */
        }

        #main-nav-ul .dropdown li a {
            padding-top: 0.5rem;
            padding-bottom: 0.5rem;
            font-size: 0.9em; /* Slightly smaller font for sub-items */
            border-bottom: none;
        }
         #main-nav-ul .dropdown li a:hover {
            background-color: #555; /* Different hover for mobile submenu */
        }
    }

    /* --- General Image Responsiveness --- */
    img {
        max-width: 100%;
        height: auto;
    }

    /* --- Additional Mobile Layout Adjustments --- */
    @media (max-width: 767px) {
        .content {
            flex-direction: column;
            align-items: center;
            margin-top: 2rem; /* Reduced from -83vh */
        }

        .image, .text {
            width: 100% !important; /* Override inline styles or more specific rules if any */
            max-width: 500px;
            float: none !important; /* Ensure no float */
        }

        .text {
            margin-top: 2rem; /* Add space between image and text */
        }

        .logo-svg, .connecting-svg {
            width: 360px; /* Original width */
            max-width: 100%; /* Ensure it shrinks if viewport is narrower than 360px */
            height: auto;
            display: block; /* Added for consistent centering with margin auto */
            margin-left: auto;
            margin-right: auto;
        }
        /* If .image img has specific vh margins, target it */
        .image img { /* This selector was in style.css, assuming it applies to the main content image */
             margin-bottom: 2rem !important; /* Override 13vh */
        }


        section {
            padding-left: 1rem;
            padding-right: 1rem;
        }

        footer {
            height: auto;
            padding: 2rem;
            margin-top: 2rem;
            text-align: center;
        }

        .title-container {
            top: -1rem;
            margin-bottom: 1rem;
        }
        .title-container h1 {
            margin-top: 2rem !important; /* Reduce original 6.25rem */
            font-size: 2rem !important; /* Adjust font size for mobile */
        }
        .logo-container {
            top: -1rem;
        }
        .connecting-container {
            /* The fixed width/height on the img tag itself is the primary issue. */
            /* CSS for the container might not fully solve it without HTML img attr change. */
            position: relative; /* Reset from potentially problematic values */
            bottom: auto;
            /* width: auto; /* Let content (img) dictate width */
            /* height: auto; */
        }

        /* Make subsection separators flow in content on mobile */
        .subsection-separator-wrapper {
            position: static !important;
            margin-top: 2rem;
            margin-bottom: 2rem;
            /* Explicitly set bottom to auto if it was previously set */
            bottom: auto !important;
        }

        /* --- Mobile Typography Adjustments --- */
        h1, .title-container h1 { /* .title-container h1 was 2rem, this unifies to 1.8rem */
            font-size: 1.8rem !important;
            line-height: 1.2 !important;
        }
        h2, .subsection h2 {
            font-size: 1.5rem !important;
            line-height: 1.3 !important;
        }
        h3 {
            font-size: 1.3rem !important;
            line-height: 1.3 !important;
        }

        .text { /* Main body text */
            font-size: 1rem !important; /* Reduced from 1.375rem default */
            line-height: 1.6 !important;
        }
        /* .text p margin-bottom: 0.8em; should scale correctly with parent's font-size */

        .subsection { /* General text in subsections, if not covered by .text */
            font-size: 1rem !important; /* Reduced from 1.25rem default */
            line-height: 1.6 !important;
        }

        footer { /* Footer text */
            font-size: 0.9rem !important; /* Reduced from 1.25rem default */
        }
        /* End of Mobile Typography Adjustments */

        /* --- coaching.html & community.html specific mobile overrides --- */
        section#coaching .subsection > .flex.justify-center.w-full,
        section#community .subsection > .flex.justify-center.w-full {
            margin-top: 2rem !important; /* Drastically reduce from inline 82vh */
        }

        /* Targeting the anchor-offset divs within coaching or community sections */
        section#coaching .anchor-offset,
        section#community .anchor-offset {
            margin-top: 0 !important; /* Reset negative -7vh margin */
            padding-top: 1rem; /* Example: provide some space above the heading */
        }
        /* End of coaching.html & community.html specific mobile overrides */
    }
    </style>
</head>
<body>
    <nav>
        <button id="hamburger-button" class="md:hidden block text-white p-2">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-6 h-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
            </svg>
        </button>
        <ul id="main-nav-ul" class="hidden md:flex md:justify-center">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Me</a></li>
            <li>
                <a href="community.html">Community</a>
                <ul class="dropdown">
                    <li><a href="community.html#ideaverse">Ideaverse</a></li>
                    <li><a href="community.html#agora-network">Agora Network</a></li>
                    <li><a href="community.html#tea-ceremony">Tea ceremony</a></li>
                </ul>
            </li>
            <li>
                <a href="coaching.html">Coaching</a>
                <ul class="dropdown">
                    <li><a href="coaching.html#community-building">Community building</a></li>
                    <li><a href="coaching.html#effective-meetings">Effective meetings</a></li>
                    <li><a href="coaching.html#tea-mastery">Tea mastery</a></li>
                </ul>
            </li>
            <li><a href="contact.html">Contact</a></li>

    </nav>
    <section id="home">
        <div class="title-container">
            <h1>Sorin Tanasa, PhD</h1>
            <div class="logo-container">
                <img class="logo-svg" src="logo.svg" alt="Sorin Tanasa Logo">
                <div class="connecting-container">
                    <img class="connecting-svg" src="connecting.svg" alt="Connecting people motto">
                </div>
            </div>
        </div>
    </section>


        <script>
            document.addEventListener('DOMContentLoaded', function() {
                const dropdowns = document.querySelectorAll('.dropdown');
                dropdowns.forEach(dropdown => {
                    const parent = dropdown.parentNode;
                    parent.addEventListener('mouseenter', function() {
                        dropdown.classList.add('show');
                    });
                    parent.addEventListener('mouseleave', function() {
                        dropdown.classList.remove('show');
                    });
                }); // End of dropdowns.forEach

                const subsections = document.querySelectorAll('.subsection');
                subsections.forEach(subsection => {
                    subsection.style.minHeight = '100vh';
                    subsection.style.height = 'auto';
                }); // End of subsections.forEach

                // Smooth scrolling
                document.querySelectorAll('a[href^="#"]').forEach(anchor => {
                    anchor.addEventListener('click', function (e) {
                        e.preventDefault();
                        document.querySelector(this.getAttribute('href')).scrollIntoView({
                            behavior: 'smooth'
                        });
                    });
                }); // End of smooth scrolling.forEach

                // Hamburger Menu Toggle Script
                const hamburgerButton = document.getElementById('hamburger-button');
                const mainNavUl = document.getElementById('main-nav-ul');

                if (hamburgerButton && mainNavUl) {
                    hamburgerButton.addEventListener('click', function() {
                        mainNavUl.classList.toggle('hidden');
                    });
                }
                // End of Hamburger Menu Toggle Script
            }); // End of DOMContentLoaded

            // Reset animations on page load
            const animatedNodes = document.querySelectorAll('.animated-node');
            animatedNodes.forEach(node => {
                node.classList.remove('animated-node');
                void node.offsetWidth; // Trigger reflow to restart animation
                node.classList.add('animated-node');
            });

            const animatedLines = document.querySelectorAll('.animated-line');
            animatedLines.forEach(line => {
                line.classList.remove('animated-line');
                void line.offsetWidth; // Trigger reflow to restart animation
                line.classList.add('animated-line');
            });
        </script>

    </body>
    </html>
